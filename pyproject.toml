[project]
name = "gupkacommander"
version = "0.1.0"
description = "GupkaCommander — автономный локальный оператор и командный центр операционной системы Windows 11"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Gupkagrop" }
]
keywords = ["windows", "desktop-agent", "computer-use", "voice-control", "local-ai"]

dependencies = [
    "PySide6>=6.7.0",
    "pywin32>=306",
    "rapidfuzz>=3.9.0",
    "pynput>=1.7.7",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    "requests>=2.32.0",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
]
vision = [
    "torch>=2.3.0",
    "transformers>=4.45.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
